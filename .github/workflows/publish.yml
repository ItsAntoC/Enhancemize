name: Publish to Modrinth and CurseForge

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-to-modrinth:
    runs-on: ubuntu-latest
    steps:
      - name: Download the .mrpack from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: gh release download "$TAG" --repo "$REPO" --pattern "*.mrpack" --dir pack

      - name: Read the Minecraft version from the pack
        id: mc
        run: |
          FILE=$(ls pack/*.mrpack | head -n 1)
          echo "version=$(unzip -p "$FILE" modrinth.index.json | jq -r '.dependencies.minecraft')" >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-unfeature-mode: subset
          modrinth-files: pack/*.mrpack
          name: ${{ github.event.release.tag_name }}
          version: ${{ github.event.release.tag_name }}
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body }}
          loaders: fabric
          game-versions: ${{ steps.mc.outputs.version }}

  publish-to-curseforge:
    runs-on: ubuntu-latest
    steps:
      - name: Download the CurseForge .zip from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: gh release download "$TAG" --repo "$REPO" --pattern "*.zip" --dir pack

      - name: Read the Minecraft version from the pack
        id: mc
        run: |
          FILE=$(ls pack/*.zip | head -n 1)
          echo "version=$(unzip -p "$FILE" manifest.json | jq -r '.minecraft.version')" >> "$GITHUB_OUTPUT"

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: pack/*.zip
          name: ${{ github.event.release.tag_name }}
          version: ${{ github.event.release.tag_name }}
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body }}
          loaders: fabric
          game-versions: ${{ steps.mc.outputs.version }}
